name: robingraph

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: robingraph-api:local
    container_name: robingraph-api
    command:
      - robingraph
      - ${ROBINGRAPH_API_MODE:-serve-fixture}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - ${ROBINGRAPH_ENV_FILE:-.env.nas}
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - edge

networks:
  edge:
    external: true
    name: ${ROBINGRAPH_EDGE_NETWORK:-robingraph-edge}
