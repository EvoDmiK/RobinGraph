[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robingraph"
version = "0.1.0"
description = "Evidence-grounded bird information GraphRAG"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "RobinGraph" }]
dependencies = [
  "fastapi>=0.115,<1",
  "langchain-core>=1,<2",
  "neo4j>=6,<7",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.12,<3",
]
tracing = [
  # MLflow's LangChain autolog version gate imports `langchain`; 3.14 is
  # validated through langchain 1.3.x and matches the NAS tracking server.
  "langchain>=1,<1.4",
  # Native Gemini path for mlflow.gemini.autolog (validated through 2.8.x).
  "google-genai>=1.21,<2.9",
  "mlflow-tracing~=3.14.0",
]

[project.scripts]
robingraph = "robingraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robingraph = [
  "api/static/*.html",
  "api/static/*.js",
  "api/static/*.css",
  "api/static/*.png",
  "api/static/*.ico",
  "ingest/migrations/*.sql",
  "retrieval/*.json",
]

[tool.unittest]
start-directory = "tests"
